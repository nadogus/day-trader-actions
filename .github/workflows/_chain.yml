name: _chain (shared)

# Plumbing only: runs original tools in order with their own arguments.
# No Claude / Anthropic API, no paid service, no broker, no orders.
on:
  workflow_call:
    inputs:
      items:
        description: "one 'skill|args|options' per line (see .github/automation/run_chain.py)"
        type: string
        required: true
      trading_day_only:
        type: boolean
        default: false
      pdftotext:
        type: boolean
        default: false
      timeout:
        type: number
        default: 60
    secrets:
      SEC_USER_AGENT:
        required: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    steps:
      - name: Code (main)
        uses: actions/checkout@v5

      - name: Data (results branch -> data/, holds trader/ and runs/)
        run: |
          if git ls-remote --exit-code --heads origin results >/dev/null; then
            git fetch --depth 1 origin results:refs/remotes/origin/results
            git worktree add -B results data origin/results
          else
            git worktree add --orphan -b results data
          fi

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: pdftotext (poppler-utils, the reader trader-pelosi uses for PTR PDFs)
        if: inputs.pdftotext
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Run
        id: run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ITEMS: ${{ inputs.items }}
          TRADING_DAY_ONLY: ${{ inputs.trading_day_only }}
        run: |
          python --version
          mapfile -t LIST < <(printf '%s\n' "$ITEMS" | sed '/^[[:space:]]*$/d')
          flags=()
          if [ "$TRADING_DAY_ONLY" = "true" ]; then flags+=(--trading-day-only); fi
          python .github/automation/run_chain.py --data data "${flags[@]}" "${LIST[@]}"

      - name: Artifact
        if: always() && steps.run.outputs.paths != ''
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.run.outputs.label }}-run${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run.outputs.paths }}
          retention-days: 90

      - name: Save dated results to the results branch
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to save."; exit 0; fi
          git commit -q -m "${{ github.workflow }}: run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:results; then echo "Saved to results."; exit 0; fi
            sleep $((i * 5))
            git pull -q --rebase origin results || true
          done
          echo "::error::could not push to the results branch"
          exit 1
