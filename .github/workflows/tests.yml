name: Testler (Python 3.13, cevrimdisi)

# Tum modullerin (broker dahil) kayitli ornek verilerle cevrimdisi testleri.
# Ag, anahtar veya broker kullanmaz.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Birim testleri
        run: |
          python --version
          python -m unittest discover -s tests -v
      - name: Calistirici sozdizimi
        run: python -m py_compile .github/automation/run_skill.py .github/automation/run_chain.py .github/automation/shadow.py
      - name: Cevrimdisi duman testi (scanner, entry, exit, news, analyst, pelosi, alerts)
        run: |
          set -e
          F=tests/fixtures
          python trader-scanner/scan.py universe --offline $F/trader-scanner/symdir --no-write
          python trader-scanner/scan.py daily --offline $F/trader-scanner/daily-spark-2026-10-19.json --now "2026-10-19 09:00" --no-write
          python trader-scanner/scan.py orb --offline $F/trader-scanner/wall5m-2026-10-19.json.gz --now "2026-10-19 10:15" --min-price 0 --no-write --show 5
          python trader-alerts/alerts.py clock --now "2026-10-19 10:15"
          python trader-news/news.py --tickers TSLA AAPL KO --offline $F/trader-news --now 2026-10-19T15:00:00Z --dry-run --state /tmp/news.json --all --hours 2000 || [ $? -eq 1 ]
          python trader-analyst/facts.py AAPL --offline $F/trader-analyst
          python trader-pelosi/ptr.py index --offline $F/trader-pelosi/2026FD.zip --member pelosi
          python trader-pelosi/ptr.py parse $F/trader-pelosi/ptr-20035143.txt
          python trader-entry/entry.py check TSLA --offline $F/trader-entry/TSLA-2026-10-19-5m.json --now "2026-10-19 10:15" --write /tmp/entry.json
          python trader-exit/exit.py plan --from /tmp/entry.json --now "2026-10-19 10:15" --write /tmp/plan.json
      - name: Golge takip (cevrimdisi, 60 gunluk ornek veri)
        run: |
          set -e
          mkdir -p /tmp/c60
          python -c "import gzip,shutil;shutil.copyfileobj(gzip.open('tests/fixtures/trader-timemachine/TSLA-60d5m.json.gz'),open('/tmp/c60/TSLA.json','wb'))"
          echo '{"mode":"orb","as_of":"2026-10-09 10:15 ET","hits":[{"symbol":"TSLA"}]}' > /tmp/wl.json
          python .github/automation/shadow.py --data /tmp/sd --date 2026-10-09 --offline /tmp/c60 --watchlist /tmp/wl.json
          grep -q "2026-10-09,TSLA,traded,9:50 AM,387.5800,384.2500,394.2400,3.3300,10:00,384.2500,stop" /tmp/sd/shadow/trades.csv
